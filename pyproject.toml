[project]
name = "kanjikyoushi-backend"
version = "0.2.0"
description = "Django API for KanjiKyoushi: learn to read kanji by typing Japanese sentences."
requires-python = ">=3.12"
dependencies = [
    "cutlet>=0.5.2",
    "django>=6.1.2",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "fsrs>=6.3.2",
    "fugashi>=1.5.2",
    "psycopg[binary]>=3.3.6",
    "unidic-lite>=1.0.8",
]
